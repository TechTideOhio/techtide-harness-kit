# RBAC pre-flight integration test for the Kubernetes live-guard
# least-privilege manifests. Runs entirely inside a throwaway kind cluster on
# the runner: no cloud credentials or repository secrets are used.
# Suite and local usage: tests/integration/rbac-pre-flight/README.md
name: RBAC Pre-flight Integration Test

on:
  push:
    branches: [master, main]
    paths:
      - 'agents/**/references/least-privilege-rbac.yaml'
      - 'skills/**/references/least-privilege-rbac.yaml'
      - 'agents/**/references/rbac-pre-flight.md'
      - 'skills/**/references/rbac-pre-flight.md'
      - 'tests/integration/rbac-pre-flight/**'
      - '.github/workflows/rbac-pre-flight.yml'
  pull_request:
    paths:
      - 'agents/**/references/least-privilege-rbac.yaml'
      - 'skills/**/references/least-privilege-rbac.yaml'
      - 'agents/**/references/rbac-pre-flight.md'
      - 'skills/**/references/rbac-pre-flight.md'
      - 'tests/integration/rbac-pre-flight/**'
      - '.github/workflows/rbac-pre-flight.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rbac-pre-flight:
    name: RBAC Pre-flight (${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ['v1.28.15', 'v1.29.10', 'v1.30.6', 'v1.31.2']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376  # v1.15.2
        with:
          install_only: true

      - name: Run RBAC pre-flight tests
        run: |
          chmod +x tests/integration/rbac-pre-flight/run-all.sh
          tests/integration/rbac-pre-flight/run-all.sh
        env:
          KIND_K8S_VERSION: ${{ matrix.k8s-version }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rbac-preflight-results-${{ matrix.k8s-version }}
          path: /tmp/rbac-preflight-*.log
