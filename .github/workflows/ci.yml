name: CI

on:
  push:
    branches: [master]
  pull_request:

# Top-level least-privilege baseline (Scorecard Token-Permissions). All jobs
# in this workflow are read-only validators; no job needs write scope.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate catalog
        run: python3 tests/validate-catalog.py

      - name: Check skill manifest
        run: python3 tests/validate-skill-manifest.py

      - name: Check asset integrity manifest
        run: python3 tests/validate-asset-integrity.py

      - name: Validate MCP trust matrix
        run: python3 tests/validate-mcp-trust-matrix.py

      - name: Reject lifecycle scripts
        run: python3 tests/validate-no-lifecycle-scripts.py

      - name: Validate links (offline)
        run: python3 tests/validate-links.py --offline

  agent-plugins:
    name: Agent Plugins 1.0 + skills distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate Agent Plugins manifest and flat skills
        run: python3 tests/validate-agent-plugins-manifest.py

  fuzz:
    name: Property-based fuzz tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run property-based fuzz tests (fast-check)
        run: npm run test:fuzz
