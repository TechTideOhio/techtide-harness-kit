name: Unsafe behavior report
description: Report a skill, agent, or adapter that may be unsafe or over-permissioned.
title: "[unsafe]: "
labels: ["security", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private customer data, exploit payloads, or internal system identifiers. Use the private disclosure path in SECURITY.md for vulnerabilities.
  - type: input
    id: asset
    attributes:
      label: Asset id or path
      placeholder: techtide-aws-live-iac-change-guard
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk type
      options:
        - Prompt injection
        - Excessive agency
        - Secret or data exposure
        - Missing approval gate
        - Unsafe network or shell access
        - Inaccurate provider claim
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Describe the issue with placeholders only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Safer expected behavior
    validations:
      required: true
