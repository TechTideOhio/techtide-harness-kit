<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TechTide Harness Kit workflow</title>
  <desc id="desc">A five-stage workflow from research to validation to export to review to release.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FAFD"/>
      <stop offset="1" stop-color="#EDF7F2"/>
    </linearGradient>
    <linearGradient id="line" x1="130" y1="180" x2="1150" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0787C8"/>
      <stop offset="0.5" stop-color="#14A66F"/>
      <stop offset="1" stop-color="#D99A16"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 22px; font-weight: 800; fill: #102033; }
      .body { font-size: 15px; fill: #41566B; }
      .tag { font-size: 13px; font-weight: 700; fill: #0E6B54; }
    </style>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#panel)"/>
  <path d="M152 180H1128" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="152" cy="180" r="12" fill="#0787C8">
    <animate attributeName="r" values="10;16;10" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="396" cy="180" r="12" fill="#0C9B9B">
    <animate attributeName="r" values="10;16;10" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="180" r="12" fill="#14A66F">
    <animate attributeName="r" values="10;16;10" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="884" cy="180" r="12" fill="#75A84A">
    <animate attributeName="r" values="10;16;10" dur="4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1128" cy="180" r="12" fill="#D99A16">
    <animate attributeName="r" values="10;16;10" dur="4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <g>
    <rect x="68" y="58" width="168" height="82" rx="16" fill="#FFFFFF" stroke="#D6E4ED"/>
    <text x="92" y="94" class="title sans">Research</text>
    <text x="92" y="121" class="body sans">Source-backed inputs</text>
  </g>
  <g>
    <rect x="312" y="220" width="168" height="82" rx="16" fill="#FFFFFF" stroke="#D6E4ED"/>
    <text x="336" y="256" class="title sans">Qualify</text>
    <text x="336" y="283" class="body sans">Schema and safety gates</text>
  </g>
  <g>
    <rect x="556" y="58" width="168" height="82" rx="16" fill="#FFFFFF" stroke="#D6E4ED"/>
    <text x="580" y="94" class="title sans">Package</text>
    <text x="580" y="121" class="body sans">Skills and agents</text>
  </g>
  <g>
    <rect x="800" y="220" width="168" height="82" rx="16" fill="#FFFFFF" stroke="#D6E4ED"/>
    <text x="824" y="256" class="title sans">Export</text>
    <text x="824" y="283" class="body sans">Harness adapters</text>
  </g>
  <g>
    <rect x="1044" y="58" width="168" height="82" rx="16" fill="#FFFFFF" stroke="#D6E4ED"/>
    <text x="1068" y="94" class="title sans">Prove</text>
    <text x="1068" y="121" class="body sans">Validation and trust</text>
  </g>
  <text x="72" y="332" class="tag sans">Built for repeatable engineering handoffs, not one-off prompt packs.</text>
</svg>
